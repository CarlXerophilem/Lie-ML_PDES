<svg xmlns="http://www.w3.org/2000/svg" width="950" height="730" viewBox="0 0 950 730">
<rect width="950" height="730" fill="#f8fafc"/>
<g font-family="sans-serif" text-anchor="middle">
<text x="475" y="34" font-size="24" fill="#0f172a">Scalar symmetry, data and flux verification</text>
<rect x="65" y="58" width="820" height="80" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="475" y="87" font-size="20" fill="#0c4a6e">Declare scalar equation</text>
<text x="475" y="114" font-size="16" fill="#334155">printed / physical corrected; g=1, kappa=1/30</text>
<path d="M475 140 v19 m-6 -6 l6 6 l6 -6" fill="none" stroke="#0369a1" stroke-width="2"/>
<rect x="65" y="166" width="820" height="80" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="475" y="195" font-size="20" fill="#0c4a6e">Common scaling and chart</text>
<text x="475" y="222" font-size="16" fill="#334155">phi=t F(z), z=s/t; t&gt;0, F&#x27;&gt;0, F-zF&#x27;&gt;0</text>
<path d="M475 248 v19 m-6 -6 l6 6 l6 -6" fill="none" stroke="#0369a1" stroke-width="2"/>
<rect x="65" y="274" width="820" height="80" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="475" y="303" font-size="20" fill="#0c4a6e">Normalize moving-ray data</text>
<text x="475" y="330" font-size="16" fill="#334155">z=1: F=2, F&#x27;=1/2, F&#x27;&#x27;=1/10</text>
<path d="M475 356 v19 m-6 -6 l6 6 l6 -6" fill="none" stroke="#0369a1" stroke-width="2"/>
<rect x="65" y="382" width="820" height="80" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="475" y="411" font-size="20" fill="#0c4a6e">Pull back current and flux</text>
<text x="475" y="438" font-size="16" fill="#334155">Jacobian=T; scalar boundary flux=I0/T</text>
<path d="M475 464 v19 m-6 -6 l6 6 l6 -6" fill="none" stroke="#0369a1" stroke-width="2"/>
<rect x="65" y="490" width="820" height="80" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="475" y="519" font-size="20" fill="#0c4a6e">Cross-check the two ODE solves</text>
<text x="475" y="546" font-size="16" fill="#334155">12 cases; error and integral drift &lt;= 1e-9</text>
<path d="M475 572 v19 m-6 -6 l6 6 l6 -6" fill="none" stroke="#0369a1" stroke-width="2"/>
<rect x="65" y="598" width="820" height="80" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="475" y="627" font-size="20" fill="#0c4a6e">Retain the evidence scope</text>
<text x="475" y="654" font-size="16" fill="#334155">exact reference tube; candidate guards stay sampled</text>
<text x="475" y="716" font-size="15" fill="#475569">No arbitrary IBVP theorem, neural speedup, or maximal bed-field classification.</text>
</g></svg>