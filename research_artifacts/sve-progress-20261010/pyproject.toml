[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lie-ml-sve-progress"
version = "0.1.0"
description = "Verified scalar SVE reductions and unrestricted near-cubic obstruction"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]
report = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["sve_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
